<title>진표의 수학 모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{--ink:#1d1a3a;--sun:#ffc93c;--sky:#8fd3ff;--leaf:#3fb96b;--berry:#ff5d73;--cream:#fffaf0;--paper:#ffffff;}
html,body{height:100%;margin:0;background:#8fd3ff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
*{box-sizing:border-box}
#app{position:fixed;inset:0;width:100vw;height:100dvh;font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.jua{font-family:'Jua','Apple SD Gothic Neo',sans-serif}
button{font-family:'Jua','Apple SD Gothic Neo',sans-serif;cursor:pointer;border:0;color:var(--ink);-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid #ffffff;outline-offset:3px}
.scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow:auto}
/* 타이틀 */
#title{background:radial-gradient(ellipse at 50% 120%,#ffe7a3 0%,#ffe7a300 55%),linear-gradient(#6cc6ff,#bfe9ff)}
.tcard{display:flex;flex-direction:column;align-items:center;gap:min(14px,2.4vh);text-align:center}
.tface{width:min(150px,26vh);height:min(150px,26vh);object-fit:contain;filter:drop-shadow(0 6px 0 rgba(29,26,58,.15));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.logo{font-family:'Jua',sans-serif;font-size:min(64px,11vh,12vw);line-height:1.05;color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),4px 6px 0 rgba(29,26,58,.25);margin:0;text-wrap:balance}
.ops{display:flex;gap:10px}
.op{width:min(56px,9vh);height:min(56px,9vh);border-radius:50%;display:grid;place-items:center;font-family:'Jua';font-size:min(34px,5.6vh);color:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.big{font-size:min(30px,5.4vh);padding:min(14px,2.4vh) 40px;border-radius:999px;background:var(--sun);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.sub{font-size:min(17px,3vh);opacity:.8;margin:0}
/* 지도 */
#map{background:linear-gradient(#7fd0ff,#d7f3ff);flex-direction:column;justify-content:flex-start;gap:min(14px,2.2vh)}
#map h2{font-family:'Jua';font-size:min(38px,7vh);margin:0;color:#fff;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.worlds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:100%;max-width:980px}
@media (max-width:700px){.worlds{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.worlds{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wcard{position:relative;overflow:hidden;border-radius:22px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);padding:min(14px,2vh) 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);background:#fff;transition:transform .08s}
.wcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.wcard .sym{font-size:min(28px,5.4vh);line-height:1;width:min(78px,14vh);height:min(78px,14vh);display:grid;place-items:center;border-radius:50%;color:#fff;border:3px solid var(--ink)}
.wcard .wn{font-size:min(22px,4vh)}
.wcard .wd{font-family:'Gowun Dodum';font-size:min(14px,2.6vh);opacity:.75;word-break:keep-all;white-space:normal;text-align:center;line-height:1.25;max-width:100%}
.wcard .rec{font-size:min(18px,3.2vh);min-height:1.3em}
.crown{position:absolute;top:4px;right:6px;font-size:min(24px,4.2vh);transform:rotate(14deg);line-height:1}
.maprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.seg{display:flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.seg button{font-size:min(18px,3.2vh);padding:8px 16px;background:#fff}
.seg button[aria-pressed="true"]{background:var(--sun)}
.pill{font-size:min(18px,3.2vh);padding:8px 16px;border-radius:999px;border:3px solid var(--ink);background:#fff}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));pointer-events:none}
#hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:999px;padding:4px 14px;font-family:'Jua';font-size:min(24px,5vh);box-shadow:0 3px 0 var(--ink)}
.dots{display:flex;gap:6px}
.dot{width:min(30px,6vh);height:min(30px,6vh);border-radius:50%;border:3px solid var(--ink);background:#fff;display:grid;place-items:center;font-family:'Jua';font-size:min(16px,3.2vh)}
.dot.ok{background:var(--leaf);color:#fff}
.hbtn{width:min(48px,9vh);height:min(48px,9vh);border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:min(22px,4.4vh);display:grid;place-items:center}
.hr{display:flex;gap:8px}
/* 조작 버튼 */
#pad{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 calc(18px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));pointer-events:none}
.pb{pointer-events:auto;width:min(96px,19vh);height:min(96px,19vh);border-radius:50%;background:rgba(255,255,255,.55);border:4px solid rgba(29,26,58,.75);display:grid;place-items:center;font-family:'Jua';font-size:min(40px,8vh);touch-action:none}
.pb.on{background:rgba(255,201,60,.85)}
#jumpB{width:min(120px,23vh);height:min(120px,23vh);font-size:min(28px,5.6vh)}
.lr{display:flex;gap:14px}
.keyhelp{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;pointer-events:none;white-space:nowrap}
/* 문제 */
#quiz{background:rgba(29,26,58,.45)}
.qcard{width:min(1040px,100%);max-height:100%;overflow:auto;background:var(--cream);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:min(18px,2.6vh) min(22px,3vw);display:flex;flex-direction:column;align-items:center;gap:min(12px,1.8vh);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.qtop{display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between}
.qwho{font-family:'Jua';font-size:min(34px,6vh)}
.qstory{font-family:'Jua';font-size:min(48px,8.4vh,6.6vw);text-align:center;margin:0;text-wrap:balance;line-height:1.3;word-break:keep-all}
.vis{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;min-height:min(60px,10vh);width:100%}
.it{position:relative;display:inline-grid;place-items:center;line-height:1;font-size:calc(var(--isz,40px));transition:opacity .3s,transform .3s}
.it .n{position:absolute;right:-6px;top:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--berry);color:#fff;font-family:'Jua';font-size:13px;display:none;place-items:center;padding:0 4px;border:2px solid #fff}
.counting .it:not(.gone) .n{display:grid}
.it.gone{opacity:.35;transform:scale(.85)}
.it.gone::after{content:'';position:absolute;inset:10% 10%;background:linear-gradient(45deg,transparent 44%,#e63946 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#e63946 44% 56%,transparent 56%)}
.grp{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border:3px dashed #8a7fb8;border-radius:16px;background:#fff;justify-content:center;max-width:44%}
.opbig{font-family:'Jua';font-size:min(60px,10vh);color:var(--berry)}
.pile{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;width:100%;min-height:calc(var(--isz,40px) + 4px)}
.plates{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.plate{min-width:min(96px,18vw);min-height:calc(var(--isz,40px) + 30px);border-radius:50%/40%;background:radial-gradient(ellipse at 50% 45%,#fff 55%,#e6e1f5 56%,#fff 70%);border:3px solid #8a7fb8;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0;padding:6px 10px;position:relative}
.plate .who{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:20px;line-height:1}
.eq{font-family:'Jua';font-size:min(124px,19vh,12vw);line-height:1;display:flex;gap:.28em;align-items:center}
.eq .q{display:inline-grid;place-items:center;min-width:1.3em;height:1.2em;border-radius:14px;background:var(--sun);border:4px solid var(--ink);padding:0 .12em}
.eq .q.done{background:var(--leaf);color:#fff}
.choices{display:flex;gap:min(16px,2.4vw);width:100%;justify-content:center}
.ch{flex:1;max-width:300px;height:min(140px,22vh);border-radius:22px;background:#fff;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:min(86px,15vh,10vw)}
.ch:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.ch.wrong{background:#ffd6dc;animation:shake .4s}
.ch.right{background:var(--leaf);color:#fff}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{font-family:'Jua';font-size:min(38px,6.6vh);word-break:keep-all;min-height:1.3em;margin:0;text-align:center}
.speak{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 18px;font-size:min(24px,4.4vh);box-shadow:0 3px 0 var(--ink)}
/* 결과 */
#result{background:rgba(29,26,58,.5)}
.rcard{background:var(--cream);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:min(24px,3.4vh) 28px;display:flex;flex-direction:column;align-items:center;gap:min(12px,2vh);text-align:center;max-width:520px;width:100%;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.rcard h2{font-family:'Jua';font-size:min(44px,8vh);margin:0}
.medal{font-size:min(80px,14vh);line-height:1}
.rstats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.rstat{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 16px;font-family:'Jua';font-size:min(22px,4vh)}
.rbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ver{position:absolute;right:10px;bottom:8px;font-size:12px;opacity:.55}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 수 모형 */
.bgrp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border:3px dashed #8a7fb8;border-radius:16px;background:#fff}
.cap{font-family:'Jua';font-size:min(26px,4.6vh)}
.blk{display:flex;align-items:flex-end;gap:calc(var(--u) * 1.4);flex-wrap:wrap;justify-content:center;max-width:min(320px,40vw)}
.pl{display:flex;align-items:flex-end;gap:calc(var(--u) * .4);flex-wrap:wrap;max-width:calc(var(--u) * 34)}
.blk i{display:block;border:1px solid var(--ink)}
.b1{width:var(--u);height:var(--u);background:#ffd23f}
.b10{width:var(--u);height:calc(var(--u) * 10);background:repeating-linear-gradient(#ff9f1c 0 calc(var(--u) - 1px),#1d1a3a66 calc(var(--u) - 1px) var(--u))}
.b100{width:calc(var(--u) * 10);height:calc(var(--u) * 10);background:repeating-linear-gradient(#1d1a3a55 0 1px,transparent 1px var(--u)),repeating-linear-gradient(90deg,#1d1a3a55 0 1px,#3fb96b 1px var(--u))}
.b1000{width:calc(var(--u) * 10);height:calc(var(--u) * 10);margin:calc(var(--u) * 2) calc(var(--u) * 2) 0 0;background:#9a6bff;box-shadow:calc(var(--u) * .7) calc(var(--u) * -.7) 0 -1px #7d4fe6,calc(var(--u) * 1.4) calc(var(--u) * -1.4) 0 -1px #6a3fd4,calc(var(--u) * 2) calc(var(--u) * -2) 0 -1px #5530b8}
.plate .blk{max-width:calc(var(--u) * 40)}
.legend{display:flex;gap:14px;font-family:'Jua';font-size:min(18px,3.4vh);opacity:.8;flex-wrap:wrap;justify-content:center;--u:3px}
.legend span{display:flex;align-items:center;gap:4px}.legend i{display:block;border:1px solid var(--ink)}
.vert{display:inline-grid;grid-auto-flow:row;grid-template-columns:repeat(var(--cols),min(60px,10vh));font-family:'Jua';font-size:min(54px,9.4vh);text-align:center;line-height:1.15;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 14px}
.vert .ph{font-size:min(20px,3.6vh);color:#8a7fb8}
.vert .vop{color:var(--berry)}
.vert .vline{height:4px;background:var(--ink);border-radius:2px;margin:3px 0}
.vert .vq{background:var(--sun);border-radius:8px;margin:2px}
.vert .vq.done{background:var(--leaf);color:#fff}
.htxt{margin:0;font-family:'Jua';font-size:min(26px,4.8vh);word-break:keep-all;text-align:center;width:100%}
.dec{font-family:'Jua';font-size:min(34px,6vh);line-height:1.4;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 18px;text-align:left}
.dec b{color:var(--leaf)}
.vis.hint{flex-direction:column}
.qcard>*{flex-shrink:0}
.vis:empty{display:none}
/* v6 */
.hl{display:flex;gap:8px;align-items:center}
.chip.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.28) rotate(-4deg)}}
.chip.fire{background:linear-gradient(#ffe08a,#ff9f1c);animation:flick 0.8s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.06)}}
.timer{position:relative;width:100%;height:min(30px,5vh);border-radius:999px;background:#ece6fa;border:3px solid var(--ink);overflow:hidden;flex-shrink:0}
.timer i{position:absolute;inset:0;background:linear-gradient(90deg,#ffe066,#ff9f1c);transform-origin:left;animation:tbar 15s linear forwards}
.timer span{position:relative;display:grid;place-items:center;height:100%;font-family:'Jua';font-size:min(18px,3.2vh)}
@keyframes tbar{to{transform:scaleX(0)}}
.qcard.shake{animation:shake .5s}
.ch{transition:transform .08s}
.ch:hover{transform:translateY(-3px)}

.qcard.wrongmode .timer{display:none}
.qcard.wrongmode .qstory{font-size:min(30px,5vh,5vw)}
.qcard.wrongmode .eq{font-size:min(64px,9vh,8vw)}
.qcard.wrongmode .ch{height:min(80px,12vh);font-size:min(48px,8vh,7vw)}
.qcard.wrongmode .vert{font-size:min(40px,6.4vh);grid-template-columns:repeat(var(--cols),min(46px,7vh))}
.qcard.wrongmode .dec{font-size:min(26px,4.4vh)}
.qcard.wrongmode .htxt{font-size:min(20px,3.6vh)}
.qcard{position:relative}
.qcard.shake{animation:jelly .7s}
@keyframes jelly{0%{transform:scale(1,1)}15%{transform:scale(1.08,.9) rotate(-2deg)}30%{transform:scale(.92,1.08) rotate(2deg)}45%{transform:scale(1.05,.95) rotate(-1deg)}60%{transform:scale(.97,1.03)}80%{transform:scale(1.01,.99)}100%{transform:scale(1,1)}}
.stamp{position:absolute;width:min(170px,28vh);height:min(170px,28vh);margin:calc(min(170px,28vh) / -2) 0 0 calc(min(170px,28vh) / -2);display:grid;place-items:center;font-family:'Jua';font-size:min(60px,10vh);color:#fff;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);background:#ff3b3b;clip-path:polygon(50% 0,61% 22%,85% 10%,78% 36%,100% 45%,79% 58%,92% 82%,66% 76%,55% 100%,44% 78%,18% 92%,24% 66%,0 55%,21% 42%,8% 18%,36% 24%);pointer-events:none;animation:stamp .45s cubic-bezier(.3,1.8,.5,1) both;z-index:3}
.stamp::before{content:'';position:absolute;inset:8%;background:#ffd23f;clip-path:inherit;z-index:-1}
@keyframes stamp{from{transform:scale(3) rotate(-40deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
.sweat{position:absolute;left:-14px;top:-26px;font-size:min(48px,8vh);animation:sweat 1.4s ease-in infinite;pointer-events:none}
@keyframes sweat{0%{transform:translateY(-6px) scale(.6);opacity:0}25%{opacity:1;transform:translateY(0) scale(1)}100%{transform:translateY(40px) scale(.9);opacity:0}}
.chip.form{gap:6px}
.fbar{display:block;width:min(54px,9vw);height:10px;border-radius:5px;background:#e9e3f7;border:2px solid var(--ink);overflow:hidden}
.fbar i{display:block;height:100%;background:linear-gradient(90deg,#3fb96b,#ffd23f);transform-origin:left}
#portrait{z-index:30;background:linear-gradient(#6cc6ff,#bfe9ff)}
.rotcard{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:var(--ink)}
.rotcard h2{font-family:'Jua';font-size:min(38px,7vw);margin:0;color:#fff;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.rotcard p{font-size:min(18px,4.4vw);margin:0}
.phone{font-size:min(110px,26vw);animation:rot 2.2s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
.chip.hearts{letter-spacing:-2px;padding:4px 10px}
@media (max-height:620px){
 .qcard{gap:min(8px,1.4vh);padding:min(12px,2vh) min(16px,2.4vw)}
 .qstory{font-size:min(34px,6.6vh,5vw)}
 .eq{font-size:min(84px,15vh,9.5vw)}
 .ch{height:min(92px,19vh);font-size:min(58px,12vh,7vw)}
 .fb{font-size:min(24px,4.6vh)}
 .qwho,.speak{font-size:min(20px,3.8vh)}
}
</style>

</head>
<body>
<div id="app">
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="hl"><div class="chip" aria-label="모은 별"><span style="color:#f5a300">★</span><span id="hStars">0</span></div><div class="chip fire" id="hStreak" hidden>🔥<span id="hStreakN">0</span>연속</div><div class="chip hearts" id="hHearts">❤️❤️❤️</div><div class="chip form" id="hForm" hidden><span id="hFormIcon">🐰</span><i class="fbar"><i id="hFormBar"></i></i></div></div>
  <div class="dots" id="hDots"></div>
  <div class="hr"><button class="hbtn" id="hSound" aria-label="소리 켜고 끄기">🔊</button><button class="hbtn" id="hHome" aria-label="지도로">🗺️</button></div>
</div>
<div id="pad" hidden>
  <div class="lr"><button class="pb" id="leftB" aria-label="왼쪽">◀</button><button class="pb" id="rightB" aria-label="오른쪽">▶</button></div>
  <button class="pb" id="jumpB" aria-label="점프">점프</button>
</div>
<div class="keyhelp" id="keyhelp" hidden>← → 움직이기 · 스페이스 점프(공중에서 한 번 더!) · 사다리는 그냥 올라가요 · 숫자 1 2 3 으로 답 고르기</div>

<div class="scr" id="portrait" hidden>
  <div class="rotcard">
    <div class="phone">📱</div>
    <h2>가로로 돌려 주세요!</h2>
    <p>옆으로 눕히면 게임이 시작돼요</p>
  </div>
</div>

<div class="scr" id="title">
  <div class="tcard">
    <img class="tface" id="tFace" alt="진표">
    <h1 class="logo">진표의<br>수학 모험</h1>
    <div class="ops">
      <div class="op" style="background:#3fb96b">+</div><div class="op" style="background:#2f9cf0">−</div><div class="op" style="background:#ff5d9e">×</div><div class="op" style="background:#9a6bff">÷</div>
    </div>
    <button class="big" id="startB">모험 떠나기!</button>
    <p class="sub">길을 막은 친구들의 수학 문제를 풀면 길이 열려요</p>
  </div>
  <div class="ver" id="ver"></div>
</div>

<div class="scr" id="map" hidden>
  <h2>어디로 모험을 갈까?</h2>
  <div class="worlds" id="worlds"></div>
  <div class="maprow">
    <p class="sub">문제마다 + − × ÷ 가 섞여 나와요</p>
    <div class="pill" id="totalStars">★ 0</div>
    <button class="pill" id="backT">처음으로</button>
  </div>
</div>

<div class="scr" id="quiz" hidden>
  <div class="qcard" id="qcard">
    <div class="qtop"><span class="qwho" id="qWho"></span><button class="speak" id="qSpeak">🔊 다시 듣기</button></div>
    <p class="qstory" id="qStory"></p>
    <div class="vis" id="qVis"></div>
    <div class="eq" id="qEq"></div>
    <div class="choices" id="qCh"></div>
    <p class="fb" id="qFb"></p>
  </div>
</div>

<div class="scr" id="result" hidden>
  <div class="rcard">
    <div class="medal" id="rMedal">🏅</div>
    <h2 id="rTitle">통과!</h2>
    <p class="sub" id="rMsg"></p>
    <div class="rstats"><div class="rstat" id="rStars"></div><div class="rstat" id="rFirst"></div></div>
    <div class="rbtns"><button class="big" id="rNext">다음 모험</button><button class="big" id="rMap" style="background:#fff">지도로</button></div>
  </div>
</div>
</div>

    $('rNext').textContent = wIndex < 4 ? '다음 모험 →' : '처음부터 다시';
    show('result'); say($('rMsg').textContent);
  }, 2600);
}
let portrait = false;
function checkOrient() {
  const p = innerHeight > innerWidth * 1.02;
  if (p !== portrait) {
    portrait = p; $('portrait').hidden = !p;
    if (p) { keys.l = keys.r = keys.j = false; jumpPressed = false; document.querySelectorAll('.pb').forEach(b => b.classList.remove('on')); try { speechSynthesis.cancel(); } catch (e) {} }
  }
}
addEventListener('resize', checkOrient); addEventListener('orientationchange', () => setTimeout(checkOrient, 200));
$('startB').addEventListener('click', () => { audioInit(); SFX.tap(); renderMap(); show('map'); state = 'map'; say('어디로 모험을 갈까?'); });
$('backT').addEventListener('click', () => { SFX.tap(); show('title'); state = 'title'; });
$('hHome').addEventListener('click', () => { SFX.tap(); iris = null; banners = []; bonk = null; celeb = null; if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; } try { speechSynthesis.cancel(); } catch (e) {} renderMap(); show('map'); state = 'map'; });
$('hSound').addEventListener('click', () => { soundOn = !soundOn; $('hSound').textContent = soundOn ? '🔊' : '🔇'; if (!soundOn) try { speechSynthesis.cancel(); } catch (e) {} else audioInit(); });
$('qSpeak').addEventListener('click', () => { if (activeGate) { const was = soundOn; soundOn = true; say(storyFor(activeGate.q)); soundOn = was; } });
$('rNext').addEventListener('click', () => { SFX.tap(); startWorld(wIndex < 4 ? wIndex + 1 : 0); });
$('rMap').addEventListener('click', () => { SFX.tap(); renderMap(); show('map'); state = 'map'; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { keys.l = keys.r = keys.j = false; if (AC) AC.suspend(); } else if (AC) AC.resume(); });

/* ---------- 화면 크기 ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  if (r.width === cssW && r.height === cssH) return;
  cssW = r.width; cssH = r.height; dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = Math.min(cssH / VH, cssW / 440);
  vw = cssW / scale; offY = cssH / scale - VH;
}
/* ---------- 루프 ---------- */
buildLevel(0); P.x = 200;
let last = performance.now();
function loop(now) {
  const dt = Math.min(2.5, (now - last) / 16.67); last = now;
  resize(); checkOrient();
  if (portrait) { draw(); requestAnimationFrame(loop); return; }
  if (state === 'title' || state === 'map') { // 배경에서 진표가 혼자 걸어요
    keys.r = true; jumpPressed = Math.random() < 0.01; update(dt); keys.r = false;
    if (P.x > gates[0].x - 60) { P.x = 90; camX = 0; }
  } else if (state !== 'result') update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
